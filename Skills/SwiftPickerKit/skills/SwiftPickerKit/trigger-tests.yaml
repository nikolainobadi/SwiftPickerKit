skill: SwiftPickerKit
runs: 3
pass: 2
cases:
  # fires
  - prompt: "In DeployCommand, when --env isn't passed, stop making people type staging or production. Show the two environments as a list they move through with the arrow keys and confirm with Enter."
    expect: fires
  - prompt: "DeployCommand asks for a comma-separated list of services. Change it so the user ticks off any of api, web, worker, and scheduler from an on-screen list in the terminal instead."
    expect: fires
  - prompt: "CleanCommand makes people paste the archive folder's path. Let them step in and out of folders with the arrow keys and choose the folder to delete that way."
    expect: fires
  - prompt: "The API token prompt in DeployCommand shows the token on screen while it's typed. Keep it hidden as the user types, the way a password prompt does."
    expect: fires
  - prompt: "Write tests for EnvironmentSelector that fake the user's choice, so the tests never wait on someone at the keyboard."
    expect: fires
  - prompt: "I'm partway through adding a rollback subcommand to ShipIt with SwiftPickerKit. Show the past release tags in a list, with the highlighted release's notes in a panel beside it that updates as the user moves."
    expect: fires

  # silent
  - prompt: "What's the difference between UIPickerView and SwiftUI's Picker on iOS, and when would I still reach for UIPickerView?"
    expect: silent
  - prompt: "Write a SwiftUI view with a ColorPicker that saves the chosen color to UserDefaults and restores it on launch."
    expect: silent
  - prompt: "Explain how ANSI escape codes move the cursor up and clear the current line in a terminal."
    expect: silent
  - prompt: "Should a command-line tool exit with status 1 or 130 when the user presses Ctrl-C? What do shells expect?"
    expect: silent
